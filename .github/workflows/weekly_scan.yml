name: Evergreen Scan

# On-demand only, no schedule. You decide when you're ready to invest, not a timer.
# Trigger it manually from the Actions tab (or ask Claude to trigger it via `gh workflow run`)
# right before you want a buy recommendation.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python weekly_scan.py

      - name: Commit report + website back to repo
        run: |
          git config user.name "evergreen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports docs
          git diff --quiet --cached || git commit -m "weekly scan $(date -u +%F)"
          git push
