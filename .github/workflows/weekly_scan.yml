name: Weekly Evergreen Scan

on:
  schedule:
    # Every Monday 00:00 UTC = 08:00 Taipei time. Edit the cron if you want a different day/time.
    - cron: "0 0 * * 1"
  workflow_dispatch: {}   # lets you also trigger it manually from the GitHub Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly scan
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekly_scan.py

      - name: Commit report + website back to repo
        run: |
          git config user.name "evergreen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports docs
          git diff --quiet --cached || git commit -m "weekly scan $(date -u +%F)"
          git push
